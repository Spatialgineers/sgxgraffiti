<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGX 3D Hand Graffiti</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          animation: {
            'spin-slow': 'spin-slow 8s linear infinite',
          },
          keyframes: {
            'spin-slow': {
              from: { transform: 'rotate(0deg)' },
              to: { transform: 'rotate(360deg)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos base unificados -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono&display=swap');
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
    }
    #root {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Import Maps para resolver dependencias tipo ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber",
        "@react-three/postprocessing": "https://esm.sh/@react-three/postprocessing@2.16.0?external=react,react-dom,three,@react-three/fiber",
        "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.17",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.303.0?external=react",
        "react-colorful": "https://esm.sh/react-colorful@5.6.1?external=react"
      }
    }
  </script>

  <!-- Babel para compilar JSX y JS moderno en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Código principal de la aplicación convertido a JS puro + JSX -->
  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useEffect, useRef, useState, useCallback, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as THREE from 'three';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { OrbitControls, PerspectiveCamera, Environment, Grid } from '@react-three/drei';
    import { EffectComposer, Bloom, Noise, Vignette, ChromaticAberration } from '@react-three/postprocessing';
    import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';
    import { motion, AnimatePresence } from 'framer-motion';
    import { Trash2, Camera, Hand, Info, Zap, Settings, Cloud, Palette, Wind, Sliders, Sun, Sparkle, CircleDot, Circle, Focus, Droplets, Activity } from 'lucide-react';
    import { HexColorPicker } from 'react-colorful';

    // --- Spatialgineers Brand Colors ---
    const BRAND = {
      AZUL_METALICO: '#32527B',
      AMARILLO_METALICO: '#FDCC0D',
      COBRE: '#B87333',
      GRIS_MEDIO: '#888888',
      AMARILLO_NEON: '#E3FF00', // Glow accent
      BLACK: '#0A0A0A',
      WHITE: '#F5F5F5'
    };

    // --- Helper: Spray Texture ---
    const createSprayTexture = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      if (ctx) {
        const mainGradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        mainGradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        mainGradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.2)');
        mainGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = mainGradient;
        ctx.fillRect(0, 0, 128, 128);

        for (let i = 0; i < 45; i++) {
          const x = 64 + (Math.random() - 0.5) * 90;
          const y = 64 + (Math.random() - 0.5) * 90;
          const r = Math.random() * 4 + 0.5;
          const opacity = Math.random() * 0.6 + 0.1;
          
          const dotGradient = ctx.createRadialGradient(x, y, 0, x, y, r);
          dotGradient.addColorStop(0, `rgba(255, 255, 255, ${opacity})`);
          dotGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = dotGradient;
          
          ctx.beginPath();
          const rx = r * (0.8 + Math.random() * 0.4);
          const ry = r * (0.8 + Math.random() * 0.4);
          ctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      return new THREE.CanvasTexture(canvas);
    };

    const SPRAY_TEXTURE = createSprayTexture();

    // --- Definición de Multiplicadores de Cap (Skinny, Fat, Flare) ---
    const getCapProperties = (brushType) => {
      let capSpread = 1.0;
      let capDensity = 1.0;
      let dripFactor = 1.0;
      let coreRatio = 0.15;

      if (brushType === 'skinny') {
        capSpread = 0.35; 
        capDensity = 3.5; 
        dripFactor = 0.1; 
        coreRatio = 0.4;
      } else if (brushType === 'fat') {
        capSpread = 1.8; 
        capDensity = 1.5; 
        dripFactor = 2.5; 
        coreRatio = 0.2;
      } else if (brushType === 'flare') {
        capSpread = 4.0; 
        capDensity = 0.4; 
        dripFactor = 0.2; 
        coreRatio = 0.05;
      }

      return { capSpread, capDensity, dripFactor, coreRatio };
    };

    // --- Components ---
    const GraffitiStroke = React.memo(({ stroke }) => {
      const points = useMemo(() => 
        stroke.points.map(p => new THREE.Vector3(p.x, p.y, p.z)), 
      [stroke.points]);

      if (points.length < 2) return null;

      const curve = useMemo(() => new THREE.CatmullRomCurve3(points), [points]);
      const { capSpread, capDensity, dripFactor, coreRatio } = getCapProperties(stroke.brushType);
      
      const sprayData = useMemo(() => {
        const positions = [];
        const colors = [];
        const baseColor = new THREE.Color(stroke.color);
        const tempVec = new THREE.Vector3();
        
        for (let i = 1; i < points.length; i++) {
          const p1 = points[i - 1];
          const p2 = points[i];
          const dist = p1.distanceTo(p2);
          
          const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
          
          const densityMultiplier = stroke.inkFlowEnabled 
            ? Math.max(1, 1 / (dist + 0.005)) * 25 
            : 15;
          const scatterMult = stroke.scatter !== undefined ? stroke.scatter : 1.0;
          const dripMult = stroke.dripIntensity !== undefined ? stroke.dripIntensity : 1.0;
          const segmentPoints = Math.floor(densityMultiplier * stroke.opacity * 30 * capDensity);
          
          for (let j = 0; j < segmentPoints; j++) {
            const t = j / segmentPoints;
            tempVec.lerpVectors(p1, p2, t);
            
            const isCore = Math.random() > (1 - coreRatio);
            const spreadBase = stroke.size * capSpread * (0.3 + stroke.opacity * 0.7) * scatterMult;
            const spread = isCore ? spreadBase * 0.25 : spreadBase * 1.1;
            
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.pow(Math.random(), isCore ? 2.2 : 0.4) * spread;
            
            const jitter = (Math.random() - 0.5) * spread * 0.3 * scatterMult;
            const px = tempVec.x + Math.cos(angle) * radius + dir.y * jitter;
            const py = tempVec.y + Math.sin(angle) * radius - dir.x * jitter;
            const pz = tempVec.z + (Math.random() - 0.5) * spread * 0.1;

            positions.push(px, py, pz);

            const grit = 0.85 + Math.random() * 0.3;
            colors.push(baseColor.r * grit, baseColor.g * grit, baseColor.b * grit);

            // Clumps para dar textura más densa en el centro
            if (isCore && Math.random() < 0.08 * capDensity) {
              const clumpCount = 4 + Math.floor(Math.random() * 8);
              const clumpOffset = spreadBase * 0.12;
              const coX = (Math.random() - 0.5) * clumpOffset;
              const coY = (Math.random() - 0.5) * clumpOffset;
              
              for (let c = 0; c < clumpCount; c++) {
                const clumpRadius = spreadBase * 0.07;
                const ca = Math.random() * Math.PI * 2;
                const cr = Math.pow(Math.random(), 0.5) * clumpRadius;
                positions.push(
                  px + coX + Math.cos(ca) * cr,
                  py + coY + Math.sin(ca) * cr,
                  pz + (Math.random() - 0.5) * clumpRadius * 0.2
                );
                colors.push(baseColor.r * 0.9, baseColor.g * 0.9, baseColor.b * 0.9);
              }
            }
          }

          // Sistema de goteo (Drips) modificado por el Cap y el nuevo control
          if (dist < 0.02 && Math.random() < 0.15 * stroke.opacity * dripFactor * dripMult) {
            const dripLength = Math.random() * 0.5 * stroke.opacity * dripFactor * dripMult;
            const dripPoints = Math.floor(dripLength * 50);
            for (let k = 0; k < dripPoints; k++) {
              const dt = k / dripPoints;
              const dripSpread = stroke.size * capSpread * 0.05 * (1 - dt);
              const dx = (Math.random() - 0.5) * dripSpread;
              const dz = (Math.random() - 0.5) * dripSpread;
              
              positions.push(
                p2.x + dx,
                p2.y - dt * dripLength,
                p2.z + dz
              );
              
              const grit = 0.8 + Math.random() * 0.2;
              colors.push(baseColor.r * grit, baseColor.g * grit, baseColor.b * grit);
            }
          }
        }
        
        return { 
          positions: new Float32Array(positions), 
          colors: new Float32Array(colors) 
        };
      }, [points, stroke.size, stroke.opacity, stroke.color, capSpread, capDensity, dripFactor, coreRatio, stroke.scatter, stroke.dripIntensity]);

      return (
        <group>
          <points>
            <bufferGeometry>
              <bufferAttribute 
                attach="attributes-position" 
                count={sprayData.positions.length / 3} 
                array={sprayData.positions} 
                itemSize={3} 
              />
              <bufferAttribute 
                attach="attributes-color" 
                count={sprayData.colors.length / 3} 
                array={sprayData.colors} 
                itemSize={3} 
              />
            </bufferGeometry>
            <pointsMaterial 
              size={stroke.textureSize * (0.03 + stroke.opacity * 0.07)} 
              vertexColors
              transparent 
              opacity={stroke.opacity * 0.9} 
              map={SPRAY_TEXTURE}
              alphaTest={0.001}
              depthWrite={false}
              sizeAttenuation={true}
              toneMapped={false}
            />
          </points>
          <mesh>
            <tubeGeometry args={[curve, Math.min(60, points.length), stroke.size * capSpread * 0.08 * stroke.opacity, 6, false]} />
            <meshBasicMaterial 
              color={stroke.color} 
              transparent 
              opacity={stroke.opacity * (stroke.brushType === 'flare' ? 0.1 : 0.3)} 
              toneMapped={false} 
            />
          </mesh>
        </group>
      );
    });

    const ActiveStroke = ({ points, color, size, brushType, textureSize, textureTiling, opacity, inkFlowEnabled, scatter = 1.0, dripIntensity = 1.0 }) => {
      const meshRef = useRef(null);
      const pointsRef = useRef(null);
      const lastPointsLength = useRef(0);

      const { capSpread, capDensity, dripFactor, coreRatio } = useMemo(() => getCapProperties(brushType), [brushType]);

      useFrame(() => {
        if (points.length >= 2 && points.length !== lastPointsLength.current) {
          const v3Points = points.map(p => new THREE.Vector3(p.x, p.y, p.z));
          const curve = new THREE.CatmullRomCurve3(v3Points);
          
          if (meshRef.current) {
            meshRef.current.geometry.dispose();
            meshRef.current.geometry = new THREE.TubeGeometry(curve, Math.min(40, points.length), size * capSpread * 0.08 * opacity, 6, false);
          }

          if (pointsRef.current) {
            const positions = [];
            const colors = [];
            const baseColor = new THREE.Color(color);
            const tempVec = new THREE.Vector3();
            
            for (let i = 1; i < v3Points.length; i++) {
              const p1 = v3Points[i - 1];
              const p2 = v3Points[i];
              const dist = p1.distanceTo(p2);
              const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
              
              const densityMultiplier = inkFlowEnabled 
                ? Math.max(1, 1 / (dist + 0.005)) * 20 
                : 12;
              const segmentPoints = Math.floor(densityMultiplier * opacity * 25 * capDensity);
              
              for (let j = 0; j < segmentPoints; j++) {
                const t = j / segmentPoints;
                tempVec.lerpVectors(p1, p2, t);
                
                const isCore = Math.random() > (1 - coreRatio);
                const spreadBase = size * capSpread * (0.4 + opacity * 0.8) * scatter;
                const spread = isCore ? spreadBase * 0.25 : spreadBase * 1.1;
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.pow(Math.random(), isCore ? 2.2 : 0.4) * spread;
                
                const jitter = (Math.random() - 0.5) * spread * 0.3 * scatter;
                const px = tempVec.x + Math.cos(angle) * radius + dir.y * jitter;
                const py = tempVec.y + Math.sin(angle) * radius - dir.x * jitter;
                const pz = tempVec.z + (Math.random() - 0.5) * spread * 0.1;

                positions.push(px, py, pz);

                const grit = 0.85 + Math.random() * 0.3;
                colors.push(baseColor.r * grit, baseColor.g * grit, baseColor.b * grit);

                if (isCore && Math.random() < 0.08 * capDensity) {
                  const clumpCount = 4 + Math.floor(Math.random() * 8);
                  const clumpOffset = spreadBase * 0.12;
                  const coX = (Math.random() - 0.5) * clumpOffset;
                  const coY = (Math.random() - 0.5) * clumpOffset;
                  
                  for (let c = 0; c < clumpCount; c++) {
                    const clumpRadius = spreadBase * 0.07;
                    const ca = Math.random() * Math.PI * 2;
                    const cr = Math.pow(Math.random(), 0.5) * clumpRadius;
                    positions.push(
                      px + coX + Math.cos(ca) * cr,
                      py + coY + Math.sin(ca) * cr,
                      pz + (Math.random() - 0.5) * clumpRadius * 0.2
                    );
                    colors.push(baseColor.r * 0.9, baseColor.g * 0.9, baseColor.b * 0.9);
                  }
                }
              }

              if (dist < 0.015 && Math.random() < 0.1 * opacity * dripFactor * dripIntensity) {
                const dripLength = Math.random() * 0.3 * opacity * dripFactor * dripIntensity;
                const dripPoints = Math.floor(dripLength * 30);
                for (let k = 0; k < dripPoints; k++) {
                  const dt = k / dripPoints;
                  const dripSpread = size * capSpread * 0.04 * (1 - dt);
                  positions.push(
                    p2.x + (Math.random() - 0.5) * dripSpread,
                    p2.y - dt * dripLength,
                    p2.z + (Math.random() - 0.5) * dripSpread
                  );
                  const grit = 0.8 + Math.random() * 0.2;
                  colors.push(baseColor.r * grit, baseColor.g * grit, baseColor.b * grit);
                }
              }
            }
            
            pointsRef.current.geometry.dispose();
            pointsRef.current.geometry = new THREE.BufferGeometry();
            pointsRef.current.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
            pointsRef.current.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
          }
          
          lastPointsLength.current = points.length;
        }
      });

      if (points.length < 2) return null;

      return (
        <group>
          <mesh ref={meshRef}>
            <meshBasicMaterial color={color} transparent opacity={opacity * (brushType === 'flare' ? 0.1 : 0.3)} toneMapped={false} />
          </mesh>
          <points ref={pointsRef}>
            <pointsMaterial 
              size={textureSize * (0.03 + opacity * 0.07)} 
              vertexColors
              transparent 
              opacity={opacity * 0.9} 
              map={SPRAY_TEXTURE}
              alphaTest={0.001}
              depthWrite={false}
              sizeAttenuation={true}
              toneMapped={false}
            />
          </points>
        </group>
      );
    };

    const HandCursor = ({ handRef, color, size, isDrawing }) => {
      const meshRef = useRef(null);
      const nozzleRef = useRef(null);
      const sprayConeRef = useRef(null);

      useFrame((state) => {
        if (meshRef.current && handRef.current) {
          meshRef.current.position.copy(handRef.current);
          if (nozzleRef.current) {
            nozzleRef.current.position.copy(handRef.current);
            nozzleRef.current.rotation.z = state.clock.elapsedTime * 0.5;
          }
          if (sprayConeRef.current) {
            sprayConeRef.current.position.copy(handRef.current);
            sprayConeRef.current.scale.setScalar(isDrawing ? 1.0 : 0);
            sprayConeRef.current.rotation.x = -Math.PI / 2;
          }
        }
      });

      return (
        <group>
          <mesh ref={meshRef}>
            <cylinderGeometry args={[size * 0.3, size * 0.4, size * 0.8, 8]} />
            <meshStandardMaterial color="#333" metalness={0.8} roughness={0.2} />
          </mesh>
          <mesh ref={nozzleRef}>
            <cylinderGeometry args={[size * 0.45, size * 0.45, size * 0.2, 16]} />
            <meshStandardMaterial color={color} emissive={color} emissiveIntensity={isDrawing ? 2 : 0.5} />
          </mesh>
          <mesh ref={sprayConeRef}>
            <coneGeometry args={[size * 0.8, size * 1.5, 16, 1, true]} />
            <meshBasicMaterial color={color} transparent opacity={0.15} wireframe={true} />
          </mesh>
        </group>
      );
    };

    function App() {
      const [strokes, setStrokes] = useState([]);
      const strokesRef = useRef([]);
      const [color, setColor] = useState(BRAND.AMARILLO_NEON);
      const [size, setSize] = useState(0.05);
      const [brushType, setBrushType] = useState('fat'); // Estilos: 'skinny', 'fat', 'flare'
      const [textureSize, setTextureSize] = useState(0.5);
      const [textureTiling, setTextureTiling] = useState(1.0);
      const [opacity, setOpacity] = useState(0.8);
      const [isDrawing, setIsDrawing] = useState(false);
      const [isHandReady, setIsHandReady] = useState(false);
      const [showInfo, setShowInfo] = useState(true);
      const [showColorPicker, setShowColorPicker] = useState(false);
      const [showMenu, setShowMenu] = useState(true);
      const [bloomIntensity, setBloomIntensity] = useState(1.8);
      const [inkFlowEnabled, setInkFlowEnabled] = useState(true);
      const [dripIntensity, setDripIntensity] = useState(1.0);
      const [scatter, setScatter] = useState(1.0);

      const handPosRef = useRef(new THREE.Vector3(0, 0, 0));
      const currentStrokeRef = useRef([]);
      const [activePoints, setActivePoints] = useState([]);

      const videoRef = useRef(null);
      const landmarkerRef = useRef(null);
      const requestRef = useRef(null);
      const lastStateRef = useRef({ color, size, isDrawing: false, brushType, textureSize, textureTiling, opacity, inkFlowEnabled, dripIntensity, scatter });

      useEffect(() => {
        lastStateRef.current = { color, size, isDrawing, brushType, textureSize, textureTiling, opacity, inkFlowEnabled, dripIntensity, scatter };
      }, [color, size, isDrawing, brushType, textureSize, textureTiling, opacity, inkFlowEnabled, dripIntensity, scatter]);

      const syncStrokes = useCallback(() => {
        setStrokes([...strokesRef.current]);
      }, []);

      useEffect(() => {
        const initHandLandmarker = async () => {
          try {
            const vision = await FilesetResolver.forVisionTasks(
              "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm"
            );
            const handLandmarker = await HandLandmarker.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                delegate: "GPU"
              },
              runningMode: "VIDEO",
              numHands: 1
            });
            landmarkerRef.current = handLandmarker;
            setIsHandReady(true);
          } catch (error) {
            console.error("Fallo al inicializar HandLandmarker:", error);
          }
        };

        initHandLandmarker();

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ 
            video: { 
              width: { ideal: 640 }, 
              height: { ideal: 480 },
              facingMode: "user"
            } 
          })
          .then(stream => {
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.width = 640;
              videoRef.current.height = 480;
              videoRef.current.onloadedmetadata = () => {
                videoRef.current?.play();
              };
            }
          })
          .catch(err => console.error("Error de cámara web:", err));
        }

        return () => {
          if (requestRef.current) cancelAnimationFrame(requestRef.current);
          landmarkerRef.current?.close();
        };
      }, []);

      const detectHands = useCallback(() => {
        if (videoRef.current && landmarkerRef.current && videoRef.current.readyState >= 2) {
          const startTimeMs = performance.now();
          const results = landmarkerRef.current.detectForVideo(videoRef.current, startTimeMs);

          if (results.landmarks && results.landmarks.length > 0) {
            const landmarks = results.landmarks[0];
            const indexTip = landmarks[8];
            const palm = landmarks[0];

            // Lienzo masivo e infinito: Incrementamos el multiplicador a 40 para un área inmensa
            const canvasScale = 40;
            const x = (0.5 - indexTip.x) * canvasScale;
            const y = (0.5 - indexTip.y) * canvasScale;
            const z = -indexTip.z * 35; // Mayor profundidad

            const targetPos = new THREE.Vector3(x, y, z);
            handPosRef.current.lerp(targetPos, 0.4);

            const sx = handPosRef.current.x;
            const sy = handPosRef.current.y;
            const sz = handPosRef.current.z;

            const fingerTips = [8, 12, 16, 20];
            const fingerMCPs = [5, 9, 13, 17];
            let foldedFingers = 0;
            for (let i = 0; i < fingerTips.length; i++) {
              const tip = landmarks[fingerTips[i]];
              const mcp = landmarks[fingerMCPs[i]];
              const distTipToPalm = Math.sqrt(Math.pow(tip.x - palm.x, 2) + Math.pow(tip.y - palm.y, 2) + Math.pow(tip.z - palm.z, 2));
              const distMcpToPalm = Math.sqrt(Math.pow(mcp.x - palm.x, 2) + Math.pow(mcp.y - palm.y, 2) + Math.pow(mcp.z - palm.z, 2));
              if (distTipToPalm < distMcpToPalm) foldedFingers++;
            }

            const isFist = foldedFingers >= 3;
            const state = lastStateRef.current;

            if (isFist) {
              if (!state.isDrawing) {
                state.isDrawing = true;
                setIsDrawing(true);
              }
              const lastPoint = currentStrokeRef.current[currentStrokeRef.current.length - 1];
              if (!lastPoint || Math.sqrt(Math.pow(sx - lastPoint.x, 2) + Math.pow(sy - lastPoint.y, 2) + Math.pow(sz - lastPoint.z, 2)) > 0.01) {
                currentStrokeRef.current.push({ x: sx, y: sy, z: sz });
                setActivePoints([...currentStrokeRef.current]);
              }
            } else {
              if (state.isDrawing) {
                if (currentStrokeRef.current.length > 1) {
                  const newStroke = { 
                    points: [...currentStrokeRef.current], 
                    color: state.color, 
                    size: state.size,
                    brushType: state.brushType,
                    textureSize: state.textureSize,
                    textureTiling: state.textureTiling,
                    opacity: state.opacity,
                    inkFlowEnabled: state.inkFlowEnabled,
                    dripIntensity: state.dripIntensity,
                    scatter: state.scatter
                  };
                  strokesRef.current.push(newStroke);
                  syncStrokes();
                }
                currentStrokeRef.current = [];
                setActivePoints([]);
                state.isDrawing = false;
                setIsDrawing(false);
              }
            }
          }
        }
        requestRef.current = requestAnimationFrame(detectHands);
      }, [syncStrokes]);

      useEffect(() => {
        requestRef.current = requestAnimationFrame(detectHands);
        return () => {
          if (requestRef.current) cancelAnimationFrame(requestRef.current);
        };
      }, [detectHands]);

      const clearCanvas = () => {
        strokesRef.current = [];
        setStrokes([]);
        currentStrokeRef.current = [];
        setActivePoints([]);
      };

      const takeSnapshot = () => {
        const canvas = document.querySelector('canvas');
        if (canvas) {
          const link = document.createElement('a');
          link.download = `SGX-Graffiti-${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }
      };

      return (
        <div className="relative w-full h-screen bg-[#050505] overflow-hidden font-sans text-white select-none">
          {/* Interfaz y overlays de escaneos */}
          <div className="absolute inset-0 pointer-events-none z-10 opacity-10 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_2px,3px_100%]" />

          <video ref={videoRef} className="hidden" playsInline muted />

          <div className="absolute inset-0 z-0">
            <Canvas shadows dpr={[1, 2]} gl={{ antialias: false, preserveDrawingBuffer: true }}>
              {/* Cámara alejada para visualizar el canvas masivo */}
              <PerspectiveCamera makeDefault position={[0, 0, 25]} fov={45} />
              <OrbitControls makeDefault enableDamping dampingFactor={0.05} minDistance={5} maxDistance={60} />
              
              <color attach="background" args={[BRAND.BLACK]} />
              <ambientLight intensity={0.3} />
              <pointLight position={[10, 10, 10]} intensity={3} color={BRAND.AMARILLO_METALICO} />
              <spotLight position={[-15, 15, 15]} angle={0.2} penumbra={1} intensity={4} color={BRAND.AZUL_METALICO} />
              
              {/* Pared de fondo infinita para no pintar en el vacío */}
              <mesh position={[0, 0, -5]} receiveShadow>
                <planeGeometry args={[1000, 1000]} />
                <meshStandardMaterial color="#080808" roughness={0.9} metalness={0.1} />
              </mesh>

              <Grid 
                infiniteGrid 
                fadeDistance={80} 
                fadeStrength={10} 
                cellSize={1} 
                sectionSize={5} 
                sectionColor={BRAND.AZUL_METALICO} 
                cellColor="#1a1a1a" 
                position={[0, -10, 0]} 
              />

              {strokes.map((s, i) => (
                <GraffitiStroke key={i} stroke={s} />
              ))}
              
              <ActiveStroke 
                points={activePoints} 
                color={color} 
                size={size} 
                brushType={brushType} 
                textureSize={textureSize} 
                textureTiling={textureTiling} 
                opacity={opacity} 
                inkFlowEnabled={inkFlowEnabled}
                dripIntensity={dripIntensity}
                scatter={scatter}
              />

              {isHandReady && (
                <HandCursor handRef={handPosRef} color={color} size={size} isDrawing={isDrawing} />
              )}

              <Environment preset="night" />

              <EffectComposer>
                <Bloom luminanceThreshold={0.4} mipmapBlur intensity={bloomIntensity} radius={0.5} />
                <ChromaticAberration offset={new THREE.Vector2(0.001, 0.001)} />
                <Noise opacity={0.04} />
                <Vignette eskil={false} offset={0.1} darkness={1.2} />
              </EffectComposer>
            </Canvas>
          </div>

          <div className="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-20">
            <div className="flex justify-between items-start pointer-events-auto">
              <div className="flex flex-col gap-0.5">
                <motion.div 
                  initial={{ x: -50, opacity: 0 }}
                  animate={{ x: 0, opacity: 1 }}
                  className="bg-[#1a1a1a]/80 backdrop-blur-xl border-l-4 border-l-[#FDCC0D] border border-white/5 p-2 rounded-r-lg shadow-2xl"
                >
                  <div className="flex items-center gap-1.5">
                    <div className="p-1 bg-[#FDCC0D] rounded-md shadow-[0_0_10px_rgba(253,204,13,0.3)]">
                      <Zap className="w-3 h-3 text-black fill-black" />
                    </div>
                    <div>
                      <h1 className="text-sm font-black tracking-tighter uppercase leading-none font-sans">
                        Spatial<span className="text-[#FDCC0D]">gineers</span>
                      </h1>
                      <p className="text-[6px] text-neutral-500 uppercase tracking-[0.2em] font-bold mt-0.5 flex items-center gap-1">
                        <span className="w-0.5 h-0.5 bg-[#FDCC0D] rounded-full animate-pulse" />
                        SGX.Graffiti
                      </p>
                    </div>
                  </div>
                </motion.div>
                <div className="px-2 py-0.5 bg-black/40 backdrop-blur-md rounded-b-md border-x border-b border-white/5">
                  <p className="text-[6px] text-neutral-400 font-medium uppercase tracking-widest italic">
                    Ingeniando Imaginación
                  </p>
                </div>
              </div>

              <div className="flex gap-1.5">
                <button 
                  onClick={() => setShowMenu(!showMenu)}
                  className={`p-2 backdrop-blur-xl border border-white/10 rounded-lg transition-all hover:scale-105 active:scale-95 shadow-xl group ${showMenu ? 'bg-[#FDCC0D] text-black' : 'bg-[#1a1a1a]/80 text-[#FDCC0D]'}`}
                  title={showMenu ? "Ocultar Menú" : "Mostrar Menú"}
                >
                  <Settings className={`w-4 h-4 ${showMenu ? 'animate-spin-slow' : ''}`} />
                </button>
                <button 
                  onClick={takeSnapshot}
                  className="p-2 bg-[#1a1a1a]/80 backdrop-blur-xl border border-white/10 rounded-lg hover:bg-white/10 transition-all hover:scale-105 active:scale-95 shadow-xl group"
                  title="Capturar Pantalla"
                >
                  <Camera className="w-4 h-4 text-emerald-400 group-hover:text-emerald-300" />
                </button>
                <button 
                  onClick={() => setShowInfo(!showInfo)}
                  className="p-2 bg-[#1a1a1a]/80 backdrop-blur-xl border border-white/10 rounded-lg hover:bg-white/10 transition-all hover:scale-105 active:scale-95 shadow-xl"
                  title="Información"
                >
                  <Info className="w-4 h-4 text-[#FDCC0D]" />
                </button>
                <button 
                  onClick={clearCanvas}
                  className="p-2 bg-red-500/10 backdrop-blur-xl border border-red-500/30 rounded-lg hover:bg-red-500/20 transition-all hover:scale-105 active:scale-95 shadow-xl group"
                  title="Borrar Lienzo"
                >
                  <Trash2 className="w-4 h-4 text-red-400 group-hover:text-red-300" />
                </button>
              </div>
            </div>

            <div className="flex flex-col items-center gap-2 pointer-events-auto mb-2 w-full max-w-full">
              <AnimatePresence>
                {showColorPicker && showMenu && (
                  <motion.div 
                    initial={{ opacity: 0, y: 10, scale: 0.95 }}
                    animate={{ opacity: 1, y: 0, scale: 1 }}
                    exit={{ opacity: 0, y: 10, scale: 0.95 }}
                    className="bg-[#1a1a1a] border border-white/10 p-3 rounded-2xl shadow-2xl mb-1 relative z-50"
                  >
                    <button 
                      onClick={() => setShowColorPicker(false)}
                      className="absolute -top-1 -right-1 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow-lg z-10 hover:bg-red-600 transition-colors text-sm"
                    >
                      ×
                    </button>
                    <HexColorPicker color={color} onChange={setColor} />
                    <div className="mt-3 flex gap-1.5 overflow-x-auto pb-1 max-w-[180px]">
                      {[BRAND.AMARILLO_NEON, BRAND.AMARILLO_METALICO, BRAND.COBRE, '#FF00FF', '#00FFFF', '#FFFFFF'].map(c => (
                        <button 
                          key={c} 
                          onClick={() => setColor(c)}
                          className="w-5 h-5 rounded-full flex-shrink-0 border border-white/20"
                          style={{ backgroundColor: c }}
                        />
                      ))}
                    </div>
                  </motion.div>
                )}
              </AnimatePresence>

              <AnimatePresence>
                {showMenu && (
                  <motion.div 
                    initial={{ opacity: 0, y: 20 }}
                    animate={{ opacity: 1, y: 0 }}
                    exit={{ opacity: 0, y: 20 }}
                    className="bg-[#1a1a1a]/90 backdrop-blur-2xl border border-white/10 p-4 rounded-[1.5rem] shadow-[0_24px_48px_-12px_rgba(0,0,0,0.8)] w-full sm:w-auto overflow-x-auto"
                  >
                    <div className="flex flex-col sm:flex-row sm:grid sm:grid-cols-[auto_1fr] gap-4 sm:gap-6 items-center">
                      <div className="flex flex-col gap-2 sm:gap-3 sm:pr-6 sm:border-r border-white/10 w-full sm:w-auto">
                        <div className="flex items-center justify-center gap-2 px-2 py-1 bg-[#FDCC0D]/10 border border-[#FDCC0D]/30 rounded-lg flex-1 sm:flex-none">
                          <Cloud className="w-3.5 h-3.5 text-[#FDCC0D]" />
                          <span className="text-[8px] font-black uppercase tracking-widest text-[#FDCC0D]">Lienzo Infinito</span>
                        </div>

                        {/* Selector de Caps (Válvulas) */}
                        <div className="flex gap-1.5 flex-1 sm:flex-none bg-black/40 p-1 rounded-lg border border-white/5">
                          <button 
                            onClick={() => setBrushType('skinny')}
                            className={`flex-1 flex flex-col items-center justify-center gap-1 p-1.5 rounded-md transition-all ${brushType === 'skinny' ? 'bg-[#FDCC0D] text-black shadow-md' : 'text-neutral-400 hover:text-white hover:bg-white/5'}`}
                            title="Skinny Cap (Trazo fino)"
                          >
                            <Focus className="w-3.5 h-3.5" />
                            <span className="text-[7px] font-bold uppercase tracking-tight">Skinny</span>
                          </button>
                          <button 
                            onClick={() => setBrushType('fat')}
                            className={`flex-1 flex flex-col items-center justify-center gap-1 p-1.5 rounded-md transition-all ${brushType === 'fat' ? 'bg-[#FDCC0D] text-black shadow-md' : 'text-neutral-400 hover:text-white hover:bg-white/5'}`}
                            title="Fat Cap (Trazo grueso)"
                          >
                            <CircleDot className="w-3.5 h-3.5" />
                            <span className="text-[7px] font-bold uppercase tracking-tight">Fat</span>
                          </button>
                          <button 
                            onClick={() => setBrushType('flare')}
                            className={`flex-1 flex flex-col items-center justify-center gap-1 p-1.5 rounded-md transition-all ${brushType === 'flare' ? 'bg-[#FDCC0D] text-black shadow-md' : 'text-neutral-400 hover:text-white hover:bg-white/5'}`}
                            title="Flare Cap (Trazo difuminado)"
                          >
                            <Circle className="w-3.5 h-3.5 opacity-60" />
                            <span className="text-[7px] font-bold uppercase tracking-tight">Flare</span>
                          </button>
                        </div>

                        <div className="flex gap-2 flex-1 sm:flex-none">
                          <button 
                            onClick={() => setShowColorPicker(!showColorPicker)}
                            className={`flex-1 flex items-center justify-center gap-2 p-2 rounded-lg transition-all ${showColorPicker ? 'bg-[#FDCC0D] text-black' : 'bg-white/5 text-white hover:bg-white/10'}`}
                            title="Select Color"
                          >
                            <Palette className="w-4 h-4" />
                            <span className="text-[9px] font-bold uppercase tracking-tight">Paleta</span>
                          </button>
                          
                          <button 
                            onClick={() => setInkFlowEnabled(!inkFlowEnabled)}
                            className={`flex-1 flex items-center justify-center gap-2 p-2 rounded-lg transition-all ${inkFlowEnabled ? 'bg-[#FDCC0D]/20 border border-[#FDCC0D]/40 text-[#FDCC0D]' : 'bg-white/5 border border-white/10 text-neutral-500'}`}
                            title="Toggle Ink Flow"
                          >
                            <Wind className="w-4 h-4" />
                            <span className="text-[9px] font-bold uppercase tracking-tight">Fluido</span>
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-x-4 sm:gap-x-6 gap-y-3 w-full sm:w-auto">
                        <div className="flex items-center gap-2">
                          <Sliders className="w-3 h-3 text-neutral-500 hidden sm:block" />
                          <div className="flex flex-col flex-1">
                            <span className="text-[6px] uppercase tracking-widest text-neutral-500 font-bold">Tamaño Base</span>
                            <input 
                              type="range" min="0.01" max="0.3" step="0.01" 
                              value={size} onChange={(e) => setSize(parseFloat(e.target.value))}
                              className="w-full h-1 accent-[#FDCC0D] cursor-pointer"
                            />
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <Droplets className="w-3 h-3 text-neutral-500 hidden sm:block" />
                          <div className="flex flex-col flex-1">
                            <span className="text-[6px] uppercase tracking-widest text-neutral-500 font-bold">Goteo</span>
                            <input 
                              type="range" min="0" max="3.0" step="0.1" 
                              value={dripIntensity} onChange={(e) => setDripIntensity(parseFloat(e.target.value))}
                              className="w-full h-1 accent-[#FDCC0D] cursor-pointer"
                            />
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <Activity className="w-3 h-3 text-neutral-500 hidden sm:block" />
                          <div className="flex flex-col flex-1">
                            <span className="text-[6px] uppercase tracking-widest text-neutral-500 font-bold">Dispersión</span>
                            <input 
                              type="range" min="0.1" max="3.0" step="0.1" 
                              value={scatter} onChange={(e) => setScatter(parseFloat(e.target.value))}
                              className="w-full h-1 accent-[#FDCC0D] cursor-pointer"
                            />
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <Sun className="w-3 h-3 text-neutral-500 hidden sm:block" />
                          <div className="flex flex-col flex-1">
                            <span className="text-[6px] uppercase tracking-widest text-neutral-500 font-bold">Densidad</span>
                            <input 
                              type="range" min="0.1" max="1.0" step="0.05" 
                              value={opacity} onChange={(e) => setOpacity(parseFloat(e.target.value))}
                              className="w-full h-1 accent-[#FDCC0D] cursor-pointer"
                            />
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <Sparkle className="w-3 h-3 text-neutral-500 hidden sm:block" />
                          <div className="flex flex-col flex-1">
                            <span className="text-[6px] uppercase tracking-widest text-neutral-500 font-bold">Partículas</span>
                            <input 
                              type="range" min="0.1" max="2.0" step="0.1" 
                              value={textureSize} onChange={(e) => setTextureSize(parseFloat(e.target.value))}
                              className="w-full h-1 accent-[#FDCC0D] cursor-pointer"
                            />
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <Wind className="w-3 h-3 text-neutral-500 hidden sm:block" />
                          <div className="flex flex-col flex-1">
                            <span className="text-[6px] uppercase tracking-widest text-neutral-500 font-bold">Resplandor</span>
                            <input 
                              type="range" min="0" max="4.0" step="0.1" 
                              value={bloomIntensity} onChange={(e) => setBloomIntensity(parseFloat(e.target.value))}
                              className="w-full h-1 accent-[#FDCC0D] cursor-pointer"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  </motion.div>
                )}
              </AnimatePresence>
            </div>
          </div>

          <AnimatePresence>
            {showInfo && (
              <motion.div 
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="absolute inset-0 z-50 flex items-center justify-center p-4 sm:p-8 bg-black/70 backdrop-blur-md pointer-events-auto"
              >
                <motion.div 
                  initial={{ scale: 0.9, y: 20 }}
                  animate={{ scale: 1, y: 0 }}
                  exit={{ scale: 0.9, y: 20 }}
                  className="bg-[#1a1a1a] border border-white/10 p-6 rounded-[2rem] max-w-md shadow-[0_48px_96px_-12px_rgba(0,0,0,1)] relative overflow-hidden"
                >
                  <div className="absolute -top-20 -right-20 w-64 h-64 bg-[#FDCC0D]/5 rounded-full blur-3xl" />
                  
                  <div className="relative z-10">
                    <div className="flex items-center gap-3 mb-6">
                      <div className="p-2 bg-[#FDCC0D] rounded-xl">
                        <Hand className="w-6 h-6 text-black" />
                      </div>
                      <div>
                        <h2 className="text-xl font-black uppercase tracking-tighter">Acceso al Sistema</h2>
                        <p className="text-[10px] text-[#FDCC0D] font-bold tracking-widest uppercase">Interfaz de Rastreo Manual v3.0</p>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <div className="flex gap-4 items-start">
                        <div className="w-8 h-8 rounded-full bg-[#FDCC0D]/10 text-[#FDCC0D] flex items-center justify-center flex-shrink-0 text-xs font-black border border-[#FDCC0D]/20">01</div>
                        <div>
                          <h3 className="font-bold uppercase text-[10px] tracking-wider mb-0.5">Inicialización Óptica</h3>
                          <p className="text-neutral-400 text-[9px] leading-relaxed">El sistema mapeará los puntos de tu mano. Asegúrate de que tu mano esté visible en la cámara.</p>
                        </div>
                      </div>
                      <div className="flex gap-4 items-start">
                        <div className="w-8 h-8 rounded-full bg-[#FDCC0D]/10 text-[#FDCC0D] flex items-center justify-center flex-shrink-0 text-xs font-black border border-[#FDCC0D]/20">02</div>
                        <div>
                          <h3 className="font-bold uppercase text-[10px] tracking-wider mb-0.5">Gesto de Síntesis</h3>
                          <p className="text-neutral-400 text-[9px] leading-relaxed">Cierra tu mano formando un <span className="text-white font-semibold">PUÑO</span> para empezar a pintar en el lienzo infinito. Abre la mano para detenerte.</p>
                        </div>
                      </div>
                      <div className="flex gap-4 items-start">
                        <div className="w-8 h-8 rounded-full bg-[#FDCC0D]/10 text-[#FDCC0D] flex items-center justify-center flex-shrink-0 text-xs font-black border border-[#FDCC0D]/20">03</div>
                        <div>
                          <h3 className="font-bold uppercase text-[10px] tracking-wider mb-0.5">Estilos de Válvulas</h3>
                          <p className="text-neutral-400 text-[9px] leading-relaxed">Explora los diferentes estilos de válvulas (caps) de graffiti: <span className="text-white font-semibold">Skinny, Fat y Flare</span> para diferentes efectos de trazo y goteo.</p>
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setShowInfo(false)}
                      className="w-full mt-8 py-3.5 bg-[#FDCC0D] hover:bg-[#ffe04d] text-black font-black uppercase tracking-widest text-xs rounded-xl transition-all shadow-[0_10px_20px_rgba(253,204,13,0.2)] hover:shadow-[0_15px_30px_rgba(253,204,13,0.3)] hover:-translate-y-1 active:translate-y-0"
                    >
                      Inicializar Interfaz
                    </button>
                  </div>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>

          <div className="absolute bottom-4 sm:bottom-6 left-4 sm:left-6 flex flex-col gap-2 pointer-events-none">
            <div className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase tracking-[0.2em] backdrop-blur-xl border ${isHandReady ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-[#FDCC0D]/10 border-[#FDCC0D]/30 text-[#FDCC0D]'}`}>
              <div className={`w-1.5 h-1.5 rounded-full ${isHandReady ? 'bg-emerald-400 animate-pulse' : 'bg-[#FDCC0D] animate-ping'}`} />
              {isHandReady ? 'Rastreo: Conectado' : 'Rastreo: Inicializando'}
            </div>
            {isDrawing && (
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase tracking-[0.2em] bg-[#FDCC0D]/10 border border-[#FDCC0D]/30 text-[#FDCC0D] animate-pulse">
                <div className="w-1.5 h-1.5 rounded-full bg-[#FDCC0D]" />
                Sintetizando Tinta...
              </div>
            )}
            <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase tracking-[0.2em] bg-white/5 border border-white/10 text-neutral-400 w-fit">
              Trazos: {strokes.length}
            </div>
          </div>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
